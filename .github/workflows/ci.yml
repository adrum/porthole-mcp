# Tests on every push and pull request. The release workflow runs the same
# jobs before it publishes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  swift:
    name: Swift package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the harness
        working-directory: apple
        run: swift test

  expo:
    name: Expo plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: expo/package-lock.json
      - name: Install
        working-directory: expo
        run: npm ci
      - name: Test the plugin
        working-directory: expo
        run: npm test
      - name: Check what the package ships
        working-directory: expo
        run: |
          # The package must carry the Swift harness it adds to apps.
          npm pack --dry-run --json > pack.json
          node -e '
            const files = require("./pack.json")[0].files.map(f => f.path);
            for (const need of ["app.plugin.js", "plugin/index.js", "native/Package.swift", "native/Sources/Porthole/Porthole.swift", "native/LICENSE"]) {
              if (!files.includes(need)) { console.error(`missing from the package: ${need}`); process.exit(1); }
            }
            if (files.some(f => f.includes("Tests/"))) { console.error("the package ships tests"); process.exit(1); }
            console.log(`${files.length} files, harness included`);
          '

  android:
    name: Android harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Test the harness, build the demo with and without Porthole
        working-directory: android
        # assembleRelease proves an app builds without Porthole: it's a
        # debugImplementation dependency, so release builds don't contain it.
        run: gradle --no-daemon :porthole:testDebugUnitTest :demo:assembleDebug :demo:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-demo-debug
          path: android/demo/build/outputs/apk/debug/demo-debug.apk

  android-e2e:
    name: Android end to end
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-demo-debug
          path: apk
      - name: Get the porthole-mcp server for Linux
        # Built by the Porthole app's pipeline from its main branch.
        run: |
          curl --fail --silent --show-error --location -o porthole-mcp \
            https://assets.austindrummond.com/apps/porthole/ci/porthole-mcp-x86_64-linux
          chmod +x porthole-mcp
          ./porthole-mcp --version
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Drive the demo on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 android/e2e.py ./porthole-mcp apk/demo-debug.apk
